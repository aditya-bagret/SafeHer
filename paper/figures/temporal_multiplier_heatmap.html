function getColor(v) {
  const t = (v - 0.33) / (1.51 - 0.33);
  if (t < 0.5) {
    const s = t * 2;
    const r = Math.round(24 + s*(230-24));
    const g = Math.round(95 + s*(241-95));
    const b = Math.round(165 + s*(235-165));
    return `rgb(${r},${g},${b})`;
  } else {
    const s = (t - 0.5) * 2;
    const r = Math.round(230 + s*(226-230));
    const g = Math.round(241 + s*(75-241));
    const b = Math.round(235 + s*(74-235));
    return `rgb(${r},${g},${b})`;

}
html += '</table>';
document.getElementById('hmap').innerHTML = html;
