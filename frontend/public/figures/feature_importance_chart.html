<div style="padding:0.5rem 0">
<div style="font-size:13px;color:var(--color-text-secondary);margin-bottom:14px">LightGBM feature importance — spatial risk model (split-based)</div>
<div style="position:relative;width:100%;height:300px"><canvas id="featChart"></canvas></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const features = ['violent_rate','violent_count','crime_count','is_domestic_rate','distance_to_police','rolling_7day','Latitude','Longitude','community_area','log_crime_count','police_district','location_type'];
const importance = [13880,13473,8940,6151,3985,3718,3586,3429,1661,1575,1033,504];
const colors = ['#E24B4A','#E8593C','#378ADD','#EF9F27','#1D9E75','#378ADD','#7F77DD','#7F77DD','#EF9F27','#378ADD','#EF9F27','#1D9E75'];
new Chart(document.getElementById('featChart'),{
  type:'bar',
  indexAxis:'y',
  data:{
    labels:features,
    datasets:[{data:importance,backgroundColor:colors.map(c=>c+'cc'),borderColor:colors,borderWidth:0.5,borderRadius:3}]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{
      legend:{display:false},
      tooltip:{callbacks:{label:ctx=>' importance: '+ctx.raw.toLocaleString()}}
    },
    scales:{
      x:{grid:{color:'rgba(128,128,128,0.1)'},ticks:{color:'#888',font:{size:11},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}},
      y:{grid:{display:false},ticks:{color:'#888',font:{size:11}}}
    }
  }
});
</script>
