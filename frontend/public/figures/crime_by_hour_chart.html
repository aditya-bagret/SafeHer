<div style="padding:0.5rem 0">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<span style="font-size:13px;color:var(--color-text-secondary)">Crime incidents by hour of day — Chicago 2001–2025 (8.4M incidents)</span>
<div style="display:flex;gap:12px;font-size:12px">
<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#E24B4A"></span>Night (9PM–5AM)</span>
<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:2px;background:#378ADD"></span>Day (6AM–8PM)</span>
</div>
</div>
<div style="position:relative;width:100%;height:260px"><canvas id="hourChart"></canvas></div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--color-text-tertiary);margin-top:6px;padding:0 40px">
<span>Midnight</span><span>6AM</span><span>Noon</span><span>6PM</span><span>11PM</span>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const hourData = [497607,270963,229573,187196,143277,120217,138901,196434,288582,367039,361309,377209,488791,402482,427327,453803,431860,438764,463985,475885,472644,456797,448454,375685];
const nightHours = new Set([0,1,2,3,4,5,21,22,23]);
const colors = hourData.map((_,i) => nightHours.has(i) ? '#E24B4A' : '#378ADD');
const borderColors = hourData.map((_,i) => nightHours.has(i) ? '#A32D2D' : '#185FA5');
new Chart(document.getElementById('hourChart'),{
  type:'bar',
  data:{
    labels:Array.from({length:24},(_,i)=>i),
    datasets:[{data:hourData,backgroundColor:colors,borderColor:borderColors,borderWidth:0.5,borderRadius:2}]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+ctx.raw.toLocaleString()+' incidents'}}},
    scales:{
      x:{grid:{display:false},ticks:{color:'#888',font:{size:11}}},
      y:{grid:{color:'rgba(128,128,128,0.1)'},ticks:{color:'#888',font:{size:11},callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}}
    }
  }
});
</script>
